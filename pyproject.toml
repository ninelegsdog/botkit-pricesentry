[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "botkit-pricesentry"
version = "1.0.0"
description = "Telegram bot for monitoring marketplace prices"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.20",
    "sentry-sdk>=2.0",
    "aiogram>=3.30",
    "aiosqlite>=0.19",
    "sqlalchemy[asyncio]>=2.0",
    "redis>=5.0",
    "aiohttp>=3.9",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["src*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.0",
    "mypy>=1.5",
]

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I", "UP", "B", "A", "SIM"]
ignore = ["SIM105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=70"
